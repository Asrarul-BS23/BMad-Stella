# DO NOT EDIT -- overwritten on every update.
#
# Default customization values for stella-investigate.
# Override in _bmad/custom/stella-investigate.user.toml (personal, gitignored).
#
# Merge rules:
# - Strings replace the default.
# - Lists append to the default list.
# - Tables merge key by key.
#
# The same personal file also holds the environment profile
# ([workflow.environments.*], [workflow.defaults], [workflow.db]). The skill reads
# that part directly at run time and writes it on first run; see
# references/profile.md for every field. Nothing about it is set here.

[workflow]

# Extra instructions to run before the profile is read.

activation_steps_prepend = []

# Extra instructions to run after activation and before the mode is chosen.

activation_steps_append = []

# Facts kept in context for the whole run.
# Entries are literal text or file references prefixed with "file:".
# File entries may use globs and are loaded during activation.

persistent_facts = [
  "file:_bmad-output/stella/project-context/context.md",
]

# Instruction run after an investigate-mode case is closed.
# Empty means no extra completion behavior.

on_complete = ""
