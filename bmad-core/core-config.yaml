# <!-- Powered by BMAD™ Core -->
markdownExploder: true
qa:
  qaLocation: bmad-docs/qa
prd:
  prdFile: bmad-docs/prd.md
  prdVersion: v4
  prdSharded: true
  prdShardedLocation: bmad-docs/prd
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: bmad-docs/architecture.md
  architectureVersion: v4
  architectureSharded: true
  architectureShardedLocation: bmad-docs/architecture
domainKnowledge:
  location: bmad-docs/domain-knowledge
  # Glob patterns for files used to generate domain-map.md. Matches against filenames in location/.
  # Use * as wildcard. If empty or omitted, all .md files are used.
  domainMapSourceFiles:
    - "*business*"
    - "*domain*"
    - "*faqs*"
customTechnicalDocuments: null
devLoadAlwaysFiles:
  - bmad-docs/architecture/coding-standards.md
  - bmad-docs/architecture/tech-stack.md
  - bmad-docs/architecture/project-structure.md
plannerLoadAlwaysFiles:
  - bmad-docs/architecture/coding-standards.md
  - bmad-docs/architecture/tech-stack.md
  - bmad-docs/architecture/project-structure.md
devDebugLog: .ai/debug-log.md
devStoryLocation:
  - bmad-docs/stories
  - bmad-docs/impl-plan
jira:
  attachments:
    enabled: true
    helperPath: .bmad-core/utils/jira-attachments
    cacheRoot: bmad-docs/cache/jira
    allowedMimePrefixes:
      - image/
      - application/pdf
      - text/
      - application/json
    maxAttachmentMB: 50
    concurrency: 5
logging:
  localDir: bmad-docs/bmad-logs
  triggerStatuses:
    - Ready for Review
    - Ready for Done
  model: default
  confluence:
    enabled: false
    logsPageUrl: ""
slashPrefix: BMad
